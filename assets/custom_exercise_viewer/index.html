<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1a1d2e; }
    canvas { display: block; width: 100%; height: 100%; }
    #status {
      position: absolute; left: 12px; bottom: 10px; padding: 6px 9px;
      border-radius: 8px; color: #dbeafe; background: rgba(17, 24, 39, 0.72);
      font: 12px/1.3 sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">載入 3D 人體模型…</div>
  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MODEL_PATH = './editor_body.glb';
    const CONTROLLABLE_BONES = Object.freeze({
      leftShoulder: 'DHIbody:upperarm_l',
      rightShoulder: 'DHIbody:upperarm_r',
      leftElbow: 'DHIbody:lowerarm_l',
      rightElbow: 'DHIbody:lowerarm_r',
      leftWrist: 'DHIbody:hand_l',
      rightWrist: 'DHIbody:hand_r',
      leftHip: 'DHIbody:thigh_l',
      rightHip: 'DHIbody:thigh_r',
      leftKnee: 'DHIbody:calf_l',
      rightKnee: 'DHIbody:calf_r',
      leftAnkle: 'DHIbody:foot_l',
      rightAnkle: 'DHIbody:foot_r',
    });
    const JOINT_DISPLAY_NAMES = Object.freeze({
      leftShoulder: '左肩',
      rightShoulder: '右肩',
      leftElbow: '左肘',
      rightElbow: '右肘',
      leftWrist: '左腕',
      rightWrist: '右腕',
      leftHip: '左髖',
      rightHip: '右髖',
      leftKnee: '左膝',
      rightKnee: '右膝',
      leftAnkle: '左踝',
      rightAnkle: '右踝',
    });
    const statusElement = document.getElementById('status');

    const rawInitialWidth = Number(window.innerWidth);
    const rawInitialHeight = Number(window.innerHeight);
    const hasInitialViewport =
      Number.isFinite(rawInitialWidth) && rawInitialWidth > 0 &&
      Number.isFinite(rawInitialHeight) && rawInitialHeight > 0;
    const initialViewportWidth = hasInitialViewport ? rawInitialWidth : 1;
    const initialViewportHeight = hasInitialViewport ? rawInitialHeight : 1;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      35,
      initialViewportWidth / initialViewportHeight,
      0.1,
      100,
    );
    camera.position.set(0, 1.25, 3.25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(initialViewportWidth, initialViewportHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableZoom = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x3b425f, 1.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(2, 3, 2);
    scene.add(keyLight);

    const editorBones = new Map();
    const restQuaternions = new Map();
    let runtimeBoneNames = [];
    let selectedJoint = 'rightShoulder';
    let selectedAxisHelper = null;
    let axisHelperSize = 0.1;
    let editorModel = null;
    let modelReady = false;
    let lastRenderHeartbeatTimestamp = Number.NEGATIVE_INFINITY;
    const pendingRotations = Object.fromEntries(
      Object.keys(CONTROLLABLE_BONES).map((joint) => [joint, { x: 0, y: 0, z: 0 }]),
    );
    let playbackState = 'stopped';
    let playbackFrames = [];
    let playbackDuration = 0;
    let playbackTime = 0;
    let playbackElapsedBeforeStart = 0;
    let playbackStartTimestamp = null;
    let lastPlaybackProgressTimestamp = Number.NEGATIVE_INFINITY;

    function callFlutter(handler, payload) {
      const bridge = window.flutter_inappwebview;
      if (bridge && typeof bridge.callHandler === 'function') {
        bridge.callHandler(handler, payload);
      }
    }

    function finiteAngle(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function normalizedRotation(rotation) {
      return {
        x: finiteAngle(rotation && rotation.x),
        y: finiteAngle(rotation && rotation.y),
        z: finiteAngle(rotation && rotation.z),
      };
    }

    function quaternionForJointRotation(joint, rotation) {
      const restQuaternion = restQuaternions.get(joint);
      if (!restQuaternion) return null;

      const eulerDelta = new THREE.Euler(
        THREE.MathUtils.degToRad(rotation.x),
        THREE.MathUtils.degToRad(rotation.y),
        THREE.MathUtils.degToRad(rotation.z),
        'XYZ',
      );
      const deltaQuaternion = new THREE.Quaternion().setFromEuler(eulerDelta);
      return restQuaternion.clone().multiply(deltaQuaternion).normalize();
    }

    function applyJointRotation(joint, rotation) {
      const bone = editorBones.get(joint);
      const targetQuaternion = quaternionForJointRotation(joint, rotation);
      if (!bone || !targetQuaternion) return false;

      // 每次都從該骨骼的 GLB rest quaternion 計算，避免 slider 更新造成累積。
      // XYZ 採骨骼 local axes，正值遵循 Three.js 右手定則。
      bone.quaternion.copy(targetQuaternion);
      bone.updateMatrixWorld(true);
      return true;
    }

    function updateSelectedAxisHelper() {
      const selectedBone = editorBones.get(selectedJoint);
      if (!selectedBone) return;
      if (selectedAxisHelper && selectedAxisHelper.parent === selectedBone) return;
      if (selectedAxisHelper && selectedAxisHelper.parent) {
        selectedAxisHelper.parent.remove(selectedAxisHelper);
      }
      selectedAxisHelper = new THREE.AxesHelper(axisHelperSize);
      selectedBone.add(selectedAxisHelper);
    }

    function updateStatus() {
      const rotation = pendingRotations[selectedJoint];
      const boneSummary = runtimeBoneNames.length > 0
        ? ` · 骨骼 ${runtimeBoneNames.length}`
        : '';
      statusElement.textContent =
        `${JOINT_DISPLAY_NAMES[selectedJoint]} X ${rotation.x.toFixed(0)}° · ` +
        `Y ${rotation.y.toFixed(0)}° · Z ${rotation.z.toFixed(0)}°${boneSummary}`;
    }

    function setEditorPose(payload) {
      if (payload && Object.hasOwn(CONTROLLABLE_BONES, payload.selectedJoint)) {
        selectedJoint = payload.selectedJoint;
      }
      if (payload && payload.rotations) {
        for (const joint of Object.keys(CONTROLLABLE_BONES)) {
          if (Object.hasOwn(payload.rotations, joint)) {
            pendingRotations[joint] = normalizedRotation(payload.rotations[joint]);
          }
        }
      }
      for (const joint of Object.keys(CONTROLLABLE_BONES)) {
        applyJointRotation(joint, pendingRotations[joint]);
      }
      updateSelectedAxisHelper();
      updateStatus();
      return editorBones.size === Object.keys(CONTROLLABLE_BONES).length;
    }

    window.setEditorPose = setEditorPose;

    function normalizedPlaybackFrames(payload) {
      if (!payload || !Array.isArray(payload.keyframes)) return [];
      return payload.keyframes
        .map((keyframe) => ({
          id: String(keyframe && keyframe.id || ''),
          time: Number(keyframe && keyframe.time),
          rotations: Object.fromEntries(
            Object.keys(CONTROLLABLE_BONES).map((joint) => [
              joint,
              normalizedRotation(keyframe && keyframe.rotations && keyframe.rotations[joint]),
            ]),
          ),
        }))
        .filter((keyframe) => Number.isFinite(keyframe.time) && keyframe.time >= 0)
        .sort((left, right) => left.time - right.time);
    }

    function applyPlaybackPose(time) {
      if (playbackFrames.length < 2) return false;
      let endIndex = playbackFrames.findIndex((keyframe) => keyframe.time >= time);
      if (endIndex < 0) endIndex = playbackFrames.length - 1;
      const startIndex = Math.max(0, endIndex - 1);
      const start = playbackFrames[startIndex];
      const end = playbackFrames[endIndex];
      const segmentDuration = end.time - start.time;
      const progress = segmentDuration > 0
        ? THREE.MathUtils.clamp((time - start.time) / segmentDuration, 0, 1)
        : 0;

      for (const joint of Object.keys(CONTROLLABLE_BONES)) {
        const bone = editorBones.get(joint);
        const startQuaternion = quaternionForJointRotation(joint, start.rotations[joint]);
        const endQuaternion = quaternionForJointRotation(joint, end.rotations[joint]);
        if (!bone || !startQuaternion || !endQuaternion) continue;
        bone.quaternion
          .slerpQuaternions(startQuaternion, endQuaternion, progress)
          .normalize();
      }
      if (editorModel) editorModel.updateMatrixWorld(true);
      return true;
    }

    function notifyPlaybackProgress(force = false, timestamp = performance.now()) {
      if (!force && timestamp - lastPlaybackProgressTimestamp < 100) return;
      lastPlaybackProgressTimestamp = timestamp;
      statusElement.textContent =
        `Keyframe 預覽 ${playbackTime.toFixed(1)} / ${playbackDuration.toFixed(1)} 秒`;
      callFlutter('EditorPlaybackProgress', {
        time: playbackTime,
        duration: playbackDuration,
      });
    }

    function notifyPlaybackState(state) {
      callFlutter('EditorPlaybackState', {
        state,
        time: playbackTime,
        duration: playbackDuration,
      });
    }

    function playEditorKeyframes(payload) {
      const frames = normalizedPlaybackFrames(payload);
      if (
        !modelReady ||
        frames.length < 2 ||
        editorBones.size !== Object.keys(CONTROLLABLE_BONES).length
      ) {
        return false;
      }
      for (let index = 1; index < frames.length; index += 1) {
        if (frames[index].time <= frames[index - 1].time) return false;
      }

      playbackFrames = frames;
      playbackDuration = frames[frames.length - 1].time;
      playbackTime = 0;
      playbackElapsedBeforeStart = 0;
      playbackStartTimestamp = null;
      lastPlaybackProgressTimestamp = Number.NEGATIVE_INFINITY;
      playbackState = 'playing';
      applyPlaybackPose(0);
      notifyPlaybackProgress(true);
      notifyPlaybackState('playing');
      return true;
    }

    function pauseEditorPlayback() {
      if (playbackState !== 'playing') return false;
      const now = performance.now();
      if (playbackStartTimestamp !== null) {
        playbackTime = Math.min(
          playbackDuration,
          playbackElapsedBeforeStart + (now - playbackStartTimestamp) / 1000,
        );
      }
      playbackElapsedBeforeStart = playbackTime;
      playbackStartTimestamp = null;
      playbackState = 'paused';
      applyPlaybackPose(playbackTime);
      notifyPlaybackProgress(true, now);
      notifyPlaybackState('paused');
      return true;
    }

    function resumeEditorPlayback() {
      if (playbackState !== 'paused') return false;
      playbackStartTimestamp = null;
      playbackState = 'playing';
      notifyPlaybackState('playing');
      return true;
    }

    function stopEditorPlayback() {
      const wasActive = playbackState !== 'stopped';
      playbackState = 'stopped';
      playbackTime = 0;
      playbackElapsedBeforeStart = 0;
      playbackStartTimestamp = null;
      if (wasActive) {
        notifyPlaybackProgress(true);
        notifyPlaybackState('stopped');
      }
      return wasActive;
    }

    function updatePlayback(timestamp) {
      if (!modelReady || playbackState !== 'playing') return;
      if (playbackStartTimestamp === null) playbackStartTimestamp = timestamp;
      playbackTime = Math.min(
        playbackDuration,
        playbackElapsedBeforeStart + (timestamp - playbackStartTimestamp) / 1000,
      );
      applyPlaybackPose(playbackTime);
      const completed = playbackTime >= playbackDuration;
      notifyPlaybackProgress(completed, timestamp);
      if (completed) {
        playbackElapsedBeforeStart = playbackDuration;
        playbackStartTimestamp = null;
        playbackState = 'completed';
        notifyPlaybackState('completed');
      }
    }

    window.playEditorKeyframes = playEditorKeyframes;
    window.pauseEditorPlayback = pauseEditorPlayback;
    window.resumeEditorPlayback = resumeEditorPlayback;
    window.stopEditorPlayback = stopEditorPlayback;

    function fitCameraToObject(object, fitOffset = 1.2) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) throw new Error('模型沒有可用的可視範圍');

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const finiteBounds = [...size.toArray(), ...center.toArray()]
        .every((value) => Number.isFinite(value));
      if (!finiteBounds || size.lengthSq() <= 0) {
        throw new Error('模型 bounding box 含有無效數值');
      }

      const canvasWidth = Number(renderer.domElement.clientWidth);
      const canvasHeight = Number(renderer.domElement.clientHeight);
      const windowWidth = Number(window.innerWidth);
      const windowHeight = Number(window.innerHeight);
      const hasCanvasViewport =
        Number.isFinite(canvasWidth) && canvasWidth > 0 &&
        Number.isFinite(canvasHeight) && canvasHeight > 0;
      const hasWindowViewport =
        Number.isFinite(windowWidth) && windowWidth > 0 &&
        Number.isFinite(windowHeight) && windowHeight > 0;
      const viewportWidth = hasCanvasViewport
        ? canvasWidth
        : hasWindowViewport ? windowWidth : 1;
      const viewportHeight = hasCanvasViewport
        ? canvasHeight
        : hasWindowViewport ? windowHeight : 1;
      camera.aspect = viewportWidth / viewportHeight;
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
      const verticalDistance = size.y / (2 * Math.tan(verticalFov / 2));
      const horizontalDistance = size.x / (2 * Math.tan(horizontalFov / 2));
      const distance = fitOffset * (Math.max(verticalDistance, horizontalDistance) + size.z / 2);
      if (!Number.isFinite(distance) || distance <= 0) {
        throw new Error(
          `Camera auto-fit 距離無效：${distance} ` +
          `(viewport ${viewportWidth}x${viewportHeight}, aspect ${camera.aspect})`,
        );
      }

      camera.position.set(center.x, center.y, center.z + distance);
      camera.near = Math.max(distance / 1000, 0.001);
      camera.far = Math.max(distance + size.length() * 10, 10);
      camera.updateProjectionMatrix();
      camera.lookAt(center);

      controls.target.copy(center);
      controls.minDistance = Math.max(size.length() * 0.1, 0.05);
      controls.maxDistance = Math.max(size.length() * 8, distance * 4);
      controls.update();
      return size;
    }

    function vectorSnapshot(vector) {
      return { x: vector.x, y: vector.y, z: vector.z };
    }

    function quaternionSnapshot(quaternion) {
      return {
        x: quaternion.x,
        y: quaternion.y,
        z: quaternion.z,
        w: quaternion.w,
      };
    }

    function logViewerDiagnostics(model) {
      model.updateMatrixWorld(true);
      const boundingBox = new THREE.Box3().setFromObject(model);
      const boundingSphere = boundingBox.getBoundingSphere(new THREE.Sphere());
      const gl = renderer.getContext();
      const contextAttributes = gl.getContextAttributes();
      let meshCount = 0;
      let visibleMeshCount = 0;
      let skinnedMeshCount = 0;
      const materialSummary = [];
      model.traverse((object) => {
        if (!object.isMesh) return;
        meshCount += 1;
        if (object.visible) visibleMeshCount += 1;
        if (object.isSkinnedMesh) skinnedMeshCount += 1;
        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];
        for (const material of materials) {
          if (!material || materialSummary.length >= 5) continue;
          materialSummary.push({
            name: material.name,
            visible: material.visible,
            opacity: material.opacity,
            transparent: material.transparent,
            color: material.color ? `#${material.color.getHexString()}` : null,
          });
        }
      });
      const controllableBoneStatus = Object.fromEntries(
        Object.entries(CONTROLLABLE_BONES).map(([joint, boneName]) => [
          joint,
          {
            boneName,
            found: editorBones.has(joint),
          },
        ]),
      );

      console.info('[CustomExerciseViewer] GLB LOAD SUCCESS');
      console.info('[CustomExerciseViewer] scene.children.length', scene.children.length);
      console.info('[CustomExerciseViewer] model.name', model.name);
      console.info('[CustomExerciseViewer] model.visible', model.visible);
      console.info(
        '[CustomExerciseViewer] model.position',
        JSON.stringify(vectorSnapshot(model.position)),
      );
      console.info('[CustomExerciseViewer] model.rotation', JSON.stringify({
        x: model.rotation.x,
        y: model.rotation.y,
        z: model.rotation.z,
        order: model.rotation.order,
      }));
      console.info(
        '[CustomExerciseViewer] model.quaternion',
        JSON.stringify(quaternionSnapshot(model.quaternion)),
      );
      console.info(
        '[CustomExerciseViewer] model.scale',
        JSON.stringify(vectorSnapshot(model.scale)),
      );
      console.info('[CustomExerciseViewer] model.boundingBox', JSON.stringify({
        min: vectorSnapshot(boundingBox.min),
        max: vectorSnapshot(boundingBox.max),
      }));
      console.info('[CustomExerciseViewer] model.boundingSphere', JSON.stringify({
        center: vectorSnapshot(boundingSphere.center),
        radius: boundingSphere.radius,
      }));
      console.info(
        '[CustomExerciseViewer] camera.position',
        JSON.stringify(vectorSnapshot(camera.position)),
      );
      console.info('[CustomExerciseViewer] camera.near/far', camera.near, camera.far);
      console.info(
        '[CustomExerciseViewer] controls.target',
        JSON.stringify(vectorSnapshot(controls.target)),
      );
      console.info('[CustomExerciseViewer] renderer.canvas', JSON.stringify({
        width: renderer.domElement.width,
        height: renderer.domElement.height,
        clientWidth: renderer.domElement.clientWidth,
        clientHeight: renderer.domElement.clientHeight,
      }));
      console.info(
        '[CustomExerciseViewer] renderer.pixelRatio',
        renderer.getPixelRatio(),
      );
      console.info('[CustomExerciseViewer] renderer.WebGL', JSON.stringify({
        isWebGL2: renderer.capabilities.isWebGL2,
        precision: renderer.capabilities.precision,
        maxTextureSize: renderer.capabilities.maxTextureSize,
        antialias: contextAttributes ? contextAttributes.antialias : null,
        drawingBufferWidth: gl.drawingBufferWidth,
        drawingBufferHeight: gl.drawingBufferHeight,
        contextLost: gl.isContextLost(),
      }));
      console.info(
        '[CustomExerciseViewer] controllableBones',
        JSON.stringify(controllableBoneStatus),
      );
      console.info('[CustomExerciseViewer] renderables', JSON.stringify({
        meshCount,
        visibleMeshCount,
        skinnedMeshCount,
        materials: materialSummary,
      }));
    }

    const loader = new GLTFLoader();
    const xhr = new XMLHttpRequest();
    xhr.open('GET', MODEL_PATH, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function() {
      if (xhr.status !== 200 && xhr.status !== 0) {
        reportError(`GLB 載入失敗：HTTP ${xhr.status}`);
        return;
      }
      loader.parse(
        xhr.response,
        '',
        (gltf) => {
          const model = gltf.scene;
          editorModel = model;
          scene.add(model);
          const modelSize = fitCameraToObject(model);

          model.traverse((object) => {
            if (object.isBone) {
              // GLTFLoader 會清除名稱中的 Three.js PropertyBinding 保留字（例如 ':'）。
              // 透過 parser association 還原 GLB node 的原始名稱，讓 Flutter mapping
              // 能持續使用經 FBX 驗證過的 DHI bone names。
              const association = gltf.parser.associations.get(object);
              const sourceNode = association && Number.isInteger(association.nodes)
                ? gltf.parser.json.nodes[association.nodes]
                : null;
              if (sourceNode && sourceNode.name) object.name = sourceNode.name;
              runtimeBoneNames.push(object.name);
            }
          });
          console.info(
            `[CustomExerciseViewer] Runtime bones (${runtimeBoneNames.length})`,
            runtimeBoneNames,
          );
          window.getEditorBoneNames = () => [...runtimeBoneNames];

          const missingBones = [];
          for (const [joint, boneName] of Object.entries(CONTROLLABLE_BONES)) {
            const bone = model.getObjectByName(boneName);
            if (!bone || !bone.isBone) {
              missingBones.push(boneName);
              continue;
            }
            editorBones.set(joint, bone);
            restQuaternions.set(joint, bone.quaternion.clone());
          }
          if (missingBones.length > 0) {
            reportError(`找不到骨骼：${missingBones.join(', ')}`);
            return;
          }

          axisHelperSize = Math.max(modelSize.length() * 0.06, 0.05);
          setEditorPose({ selectedJoint, rotations: pendingRotations });
          modelReady = true;
          try {
            logViewerDiagnostics(model);
          } catch (diagnosticError) {
            console.warn(
              '[CustomExerciseViewer] diagnostics failed',
              diagnosticError && diagnosticError.message || diagnosticError,
            );
          }
          callFlutter('EditorViewerReady', {
            runtimeBoneCount: runtimeBoneNames.length,
            controllableBoneCount: editorBones.size,
            boneNames: CONTROLLABLE_BONES,
            axisSpace: 'local',
            eulerOrder: 'XYZ',
          });
        },
        (error) => reportError(`GLB 解析失敗：${error.message || error}`),
      );
    };
    xhr.onerror = () => reportError('無法讀取人體 GLB');
    xhr.send();

    function reportError(message) {
      statusElement.textContent = message;
      statusElement.style.color = '#fecaca';
      callFlutter('EditorViewerError', { message });
      console.error('[CustomExerciseViewer]', message);
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      updatePlayback(timestamp);
      if (
        Number.isFinite(timestamp) &&
        timestamp - lastRenderHeartbeatTimestamp >= 2000
      ) {
        lastRenderHeartbeatTimestamp = timestamp;
        console.info('[CustomExerciseViewer] RENDER ACTIVE', JSON.stringify({
          modelReady,
          sceneChildren: scene.children.length,
          renderCalls: renderer.info.render.calls,
          triangles: renderer.info.render.triangles,
        }));
      }
    }
    animate();

    window.addEventListener('resize', () => {
      const width = Number(window.innerWidth);
      const height = Number(window.innerHeight);
      if (
        !Number.isFinite(width) || width <= 0 ||
        !Number.isFinite(height) || height <= 0
      ) {
        return;
      }
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
